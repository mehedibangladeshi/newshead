# .github/workflows/scrape.yml
name: Scrape and publish articles

on:
  schedule:
    - cron: '0 1,5,7,10,13,16,22 * * *'   # 07:00 / 11:00 / 13:00 / 16:00 / 19:00 / 22:00 / 04:00(+1d) Asia/Dhaka (UTC+6)
  workflow_dispatch:

concurrency:
  group: scrape-and-publish
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: [self-hosted, Linux]
    # The uncapped taxonomy (100+ mapped sections across 8 sources) took
    # ~13 minutes for the scrape step alone before 2026-08-25's 3-source
    # addition. bdnews24bangla alone now adds ~25-30 minutes on top of that:
    # its listing cards mostly lack a combined thumbnail+summary, so
    # enrich_item() falls back to a full per-article fetch for ~290 of its
    # ~330 articles (confirmed live: a real `gh workflow run scrape.yml`
    # hit the old 40-minute limit and got cancelled with "The operation was
    # canceled" mid-run). 90 minutes leaves real headroom above the ~55-60
    # minute worst case seen locally, for checkout/build overhead and CI
    # network variability.
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t newshead-scraper .
      - run: docker run --rm -v "$PWD:/app" newshead-scraper
      - run: |
          mkdir -p publish
          cp articles.json publish/articles.json
      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: publish
          keep_files: false
          force_orphan: true
