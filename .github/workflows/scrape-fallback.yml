# .github/workflows/scrape-fallback.yml
name: Scrape and publish articles (hosted-runner fallback)

on:
  schedule:
    - cron: '0 3,7,12,16 * * *'   # 2h after the primary self-hosted schedule
  workflow_dispatch:

concurrency:
  group: scrape-and-publish-fallback
  cancel-in-progress: false

jobs:
  fallback-scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      actions: read
    steps:
      # Skip entirely if the primary (self-hosted) job already published
      # within the last 3h - long enough to always cover an on-time primary
      # run (2h offset), short enough to never suppress a real outage
      # (4h gap between cycles).
      - id: guard
        run: |
          LATEST=$(gh run list --repo "$REPO" --workflow scrape.yml --json conclusion,createdAt --limit 5 \
            --jq '[.[] | select(.conclusion=="success")] | sort_by(.createdAt) | last | .createdAt')
          if [ -n "$LATEST" ] && [ $(( ($(date -u +%s) - $(date -u -d "$LATEST" +%s)) / 60 )) -lt 180 ]; then
            echo "already_succeeded=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_succeeded=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
      - uses: actions/checkout@v7
        if: steps.guard.outputs.already_succeeded == 'false'
      - uses: actions/setup-python@v7
        if: steps.guard.outputs.already_succeeded == 'false'
        with:
          python-version: '3.x'
      - if: steps.guard.outputs.already_succeeded == 'false'
        run: pip install -r scraper/requirements.txt
      - if: steps.guard.outputs.already_succeeded == 'false'
        run: python scripts/generate.py
      - if: steps.guard.outputs.already_succeeded == 'false'
        run: |
          mkdir -p publish
          cp articles.json publish/articles.json
      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        if: steps.guard.outputs.already_succeeded == 'false'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: publish
          keep_files: false
          force_orphan: true
